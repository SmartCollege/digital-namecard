<!DOCTYPE html>
<html>

<head>
  <title>Gregg Schlaudecker - AdaptFirst</title>
  <link rel="stylesheet" href="main.css">
  <link href='https://fonts.googleapis.com/css?family=Lato:200,300,400,700' rel='stylesheet' type='text/css'>
<link href="https://fonts.googleapis.com/css?family=Muli:200,300" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
</head>

<body>
	<section class="bg-color-grey banner">
		<div class="container">
			<div class="row">
				<div class="col"></div>
				<div class="col is-5">
					<img class="profile-pic" src="gregg-headshot.webp" alt="Profile Picture">
				</div>
				<div class="col"></div>
			</div>
		</div>
	</section>

	<section class="bg-color-white primary-info">
		<div class="container">
			<div class="row name-title-company">
				<div class="col is-6">
					<p class="text-name">Gregg Schlaudecker</p>
					<p class="text-title-company">Chartered Financial Consultant, CLU&reg; ChFC&reg;</p>
					<p class="text-title-company">AdaptFirst &ndash; Tax and Investments</p>
					<p class="text-title-company">Balancing Life, Taxes, &amp; Wealth</p>
				</div>
				<div class="col">
					<img src="adaptfirst-logo.webp" alt="AdaptFirst Logo">
				</div>
			</div>
		</div>
	</section>

	<section class="bg-color-white secondary-info">
		<a href="mailto:gregg@adaptfirst.com">
			<div class="container">
				<div class="row detail">
					<div class="col">
						<img src="assets/icon-email.svg" alt="Email Icon">
					</div>
					<div class="col is-8">
						<p class="text-detail">gregg@adaptfirst.com</p>
					</div>
					<div class="col">
						<img src="assets/right-arrow.svg" alt="Right Arrow" height="50%" width="40%">
					</div>
				</div>
			</div>
		</a>
	</section>

	<section class="bg-color-white secondary-info">
		<a href="tel:336-759-0300,,2000">
			<div class="container">
				<div class="row detail">
					<div class="col">
						<img src="assets/icon-phone.svg" alt="Phone Icon">
					</div>
					<div class="col is-8">
						<p class="text-detail">(336) 759-0300 ext. 2000</p>
					</div>
					<div class="col">
						<img src="assets/right-arrow.svg" alt="Right Arrow" height="50%" width="40%">
					</div>
				</div>
			</div>
		</a>
	</section>

	<section class="bg-color-white secondary-info">
		<a href="https://www.adaptfirst.com">
			<div class="container">
				<div class="row detail">
					<div class="col">
						<img src="assets/icon-website.svg" alt="Website Icon">
					</div>
					<div class="col is-8">
						<p class="text-detail">adaptfirst.com</p>
					</div>
					<div class="col">
						<img src="assets/right-arrow.svg" alt="Right Arrow" height="50%" width="40%">
					</div>
				</div>
			</div>
		</a>
	</section>

	<section class="bg-color-white secondary-info">
		<a href="https://www.google.com/maps/search/?api=1&query=109-A+East+Mountain+St,+Kernersville,+NC+27284">
			<div class="container">
				<div class="row detail">
					<div class="col">
						<img src="assets/icon-address.svg" alt="Address Icon">
					</div>
					<div class="col is-8">
						<p class="text-detail">109-A East Mountain St, Kernersville, NC 27284</p>
					</div>
					<div class="col">
						<img src="assets/right-arrow.svg" alt="Right Arrow" height="50%" width="40%">
					</div>
				</div>
			</div>
		</a>
	</section>

	<section class="bg-color-white bottom">
		<div class="container">
			<div class="row">
				<div class="col"></div>
				<div class="col is-5">
					<a class="button" href="user.vcf">Add to Contacts</a>
				</div>
				<div class="col"></div>
			</div>
		</div>
	</section>

</body>

</html>
